name: Capability regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: capabilities-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert Python compatibility
        run: python -c "import sys; assert sys.version_info[:2] == (3,12)"
      - name: Install RuleGenerator
        run: python -m pip install -e .
      - name: Verify supported capabilities
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build distribution artifacts
        run: |
          python -m pip install build
          python -m build --sdist --wheel --outdir dist
      - name: Check wheel metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
