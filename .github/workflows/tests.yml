name: Capability regression tests
on:
  push:
  pull_request:
jobs:
  capabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RuleGenerator
        run: python -m pip install -e .
      - name: Verify supported capabilities
        run: python -m unittest discover -s tests -p 'test_*.py' -v
