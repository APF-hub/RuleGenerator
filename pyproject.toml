[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "rulegenerator"
version = "0.62.0"
description = "Experimental cumulative typed program synthesis"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.24"]
[tool.setuptools.packages.find]
include = ["rulegen*"]
